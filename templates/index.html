<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Парсинг университетов</title>
</head>
<body>
    <div>
        <h1>Парсинг университетов</h1>

        <form method="POST">
            <button type="submit" name="start_parsing">Начать парсинг</button>
        </form>

        <form method="POST">
            <label for="command">Введите команду:</label>
            <input type="text" id="command" name="command" placeholder="Введите команду...">
            <button type="submit">Отправить команду</button>
        </form>

        {% if message %}
        <p>{{ message }}</p>
        {% endif %}

        {% if universities %}
        <h2>Список университетов:</h2>
        <ul>
            {% for university in universities %}
                <li>
                    <a href="{{ university[1] }}" target="_blank">{{ university[0] }}</a> 
                    - Кол-во программ доп образования: {{ university[2] }}
                </li>
            {% endfor %}
        </ul>
        {% endif %}
    </div>
</body>
</html>
